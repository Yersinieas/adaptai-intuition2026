<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%);min-height:100vh;padding:20px}.bus-app{max-width:420px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.1);overflow:hidden}.bus-header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:20px;font-size:20px;font-weight:700;text-align:center}.bus-tabs{display:flex;background:#f8f9fa;border-bottom:1px solid #dee2e6}.tab{flex:1;padding:10px 8px;text-align:center;font-size:10px;color:#6c757d;cursor:pointer;border-bottom:3px solid transparent;transition:all .3s}.tab.active{color:#667eea;border-bottom-color:#667eea;background:#fff}.bus-content{padding:20px;max-height:400px;overflow-y:auto}.search-box{width:100%;padding:8px;border:1px solid #ced4da;border-radius:6px;font-size:11px;margin-bottom:15px}.bus-stop-list{display:flex;flex-direction:column;gap:8px}.bus-stop-item{padding:10px;border:1px solid #e9ecef;border-radius:6px;cursor:pointer;transition:all .2s;font-size:11px;color:#6c757d}.bus-stop-item:hover{background:#f8f9fa;border-color:#667eea}.stop-name{font-weight:600;color:#495057;margin-bottom:4px}.bus-routes{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}.bus-route{background:#e9ecef;padding:2px 6px;border-radius:4px;font-size:9px}.bus-timing{font-size:9px;color:#adb5bd}.widget-fab{position:fixed;bottom:30px;right:30px;width:64px;height:64px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 20px rgba(102,126,234,.5);z-index:1000;transition:all .3s;animation:pulse 2s infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}.widget-fab:hover{transform:scale(1.1)!important}.widget-fab svg{width:32px;height:32px;fill:#fff}.intent-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:2000;align-items:center;justify-content:center}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.intent-modal.active{display:flex;animation:fadeIn .3s}.intent-content{background:#fff;border-radius:20px;padding:40px;max-width:540px;width:90%;text-align:center;animation:slideUp .4s;position:relative}@keyframes slideUp{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}.intent-title{font-size:32px;font-weight:700;margin-bottom:12px;color:#212529}.intent-subtitle{font-size:16px;color:#6c757d;margin-bottom:32px}.intent-options{display:flex;flex-direction:column;gap:16px}.intent-btn{padding:24px;font-size:20px;font-weight:600;border:3px solid #667eea;background:#fff;color:#667eea;border-radius:12px;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:16px;text-align:left}.intent-btn:hover{background:#667eea;color:#fff;transform:translateY(-4px);box-shadow:0 8px 20px rgba(102,126,234,.3)}.intent-icon{font-size:32px}.intent-text{flex:1}.intent-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border:none;background:#e9ecef;color:#495057;border-radius:50%;cursor:pointer;font-size:20px;transition:all .2s}.intent-close:hover{background:#dee2e6}.adaptive-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,.98);z-index:1500;align-items:center;justify-content:center}.adaptive-overlay.active{display:flex;animation:fadeIn .4s}.adaptive-content{text-align:center;max-width:700px;width:90%;padding:40px}.adaptive-title{font-size:42px;font-weight:700;margin-bottom:24px;color:#212529}.adaptive-instruction{font-size:28px;line-height:1.5;color:#495057;margin-bottom:32px}.adaptive-result{padding:40px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border-radius:20px;font-size:48px;font-weight:700;margin-bottom:32px;box-shadow:0 10px 30px rgba(102,126,234,.3)}.adaptive-features{display:flex;justify-content:center;gap:20px;margin-bottom:32px;flex-wrap:wrap}.feature-badge{background:#e7f5ff;color:#1971c2;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600}.adaptive-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.adaptive-btn{padding:18px 32px;font-size:20px;border:none;background:#667eea;color:#fff;border-radius:10px;cursor:pointer;font-weight:600;min-width:180px;transition:all .3s}.adaptive-btn:hover{background:#5568d3;transform:translateY(-2px)}.adaptive-btn.secondary{background:#e9ecef;color:#495057}.adaptive-btn.secondary:hover{background:#dee2e6}.metrics-panel{position:fixed;top:20px;right:20px;background:#fff;border-radius:12px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.1);z-index:500;max-width:320px;min-width:280px}.metrics-title{font-size:18px;font-weight:700;margin-bottom:16px;color:#212529}.mode-indicator{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.mode-label{font-size:14px;color:#6c757d}.mode-value{font-size:14px;font-weight:700;padding:4px 12px;border-radius:6px;background:#e9ecef;color:#495057}.mode-value.widget-mode{background:#e7f5ff;color:#1971c2}.metric-divider{height:1px;background:#dee2e6;margin:16px 0}.metric-comparison{font-size:13px}.metric-header{font-weight:600;color:#495057;margin-bottom:12px}.metric-row{margin-bottom:12px}.metric-label{color:#6c757d;font-size:13px;display:block;margin-bottom:4px}.metric-values{display:flex;align-items:center;gap:8px;font-weight:600}.metric-baseline{color:#dc3545}.metric-arrow{color:#adb5bd}.metric-widget{color:#28a745}.metric-row.highlight{background:#f8f9fa;padding:12px;border-radius:8px;margin-top:12px}.independence-value{font-size:24px;font-weight:700;color:#28a745}@media(max-width:768px){.metrics-panel{top:10px;right:10px;max-width:240px;min-width:200px;padding:16px}.intent-content{padding:30px 20px}.intent-title{font-size:24px}.intent-btn{font-size:16px;padding:18px}.adaptive-title{font-size:32px}.adaptive-instruction{font-size:20px}.adaptive-result{ <body>
<div class="bus-app">
<div class="bus-header">🚍 SG Bus Timings</div>
<div class="bus-tabs">
<div class="tab active">Bus Stops</div>
<div class="tab">Routes</div>
<div class="tab">Favorites</div>
</div>
<div class="bus-content">
<input type="text" class="search-box" placeholder="Search bus stop..." id="searchBox">
<div class="bus-stop-list" id="busStopList"></div>
</div>
</div>
<div class="widget-fab" id="widgetFab">
<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
</svg>
</div>
<div class="intent-modal" id="intentModal">
<div class="intent-content">
<div class="intent-title">What would you like to do?</div>
<div class="intent-subtitle">AI predicted your most likely tasks</div>
<div class="intent-options">
<button class="intent-btn" data-intent="check-bus">
<span class="intent-icon">🚍</span>
<span class="intent-text">Check Bus 179 arrival at Clementi MRT</span>
</button>
<button class="intent-btn" data-intent="find-route">
<span class="intent-icon">🗺️</span>
<span class="intent-text">Find route to my destination</span>
</button>
<button class="intent-btn" data-intent="view-favorites">
<span class="intent-icon">⭐</span>
<span class="intent-text">View my favorite bus stops</span>
</button>
</div>
<button class="intent-close" id="intentClose">✕</button>
</div>
</div>
<div class="adaptive-overlay" id="adaptiveOverlay">
<div class="adaptive-content">
<div class="adaptive-title" id="adaptiveTitle"></div>
<div class="adaptive-instruction" id="adaptiveInstruction"></div>
<div class="adaptive-result" id="adaptiveResult"></div>
<div class="adaptive-features" id="adaptiveFeatures"></div>
<div class="adaptive-actions">
<button class="adaptive-btn primary" id="confirmBtn">✓ Confirm</button>
<button class="adaptive-btn secondary" id="repeatBtn">🔄 Repeat with Voice</button>
<button class="adaptive-btn secondary" id="closeBtn">✕ Back to Home</button>
</div>
</div>
</div>
<div class="metrics-panel">
<div class="metrics-title">📊 Impact Metrics</div>
<div class="mode-indicator">
<span class="mode-label">Current Mode:</span>
<span class="mode-value" id="modeValue">Baseline</span>
</div>
<div class="metric-divider"></div>
<div class="metric-comparison">
<div class="metric-header">Before vs After</div>
<div class="metric-row">
<span class="metric-label">Steps to Complete:</span>
<div class="metric-values">
<span class="metric-baseline">8</span>
<span class="metric-arrow">→</span>
<span class="metric-widget" id="stepsWidget">-</span>
</div>
</div>
<div class="metric-row">
<span class="metric-label">Time (seconds):</span>
<div class="metric-values">
<span class="metric-baseline">45</span>
<span class="metric-arrow">→</span>
<span class="metric-widget" id="timeWidget">-</span>
</div>
</div>
<div class="metric-row">
<span class="metric-label">Errors:</span>
<div class="metric-values">
<span class="metric-baseline">3</span>
<span class="metric-arrow">→</span>
<span class="metric-widget" id="errorsWidget">-</span>
</div>
</div>
<div class="metric-divider"></div>
<div class="metric-row highlight">
<span class="metric-label">Independence Score:</span>
<span class="independence-value" id="independenceValue">0%</span>
</div>
</div>
</div>
